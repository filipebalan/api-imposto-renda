# 1. URL de Conexão:
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/irpf_db}

# 2. Usuário e Senha
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1994}

# 3. Comportamento do Tradutor (JPA)
# 'update': Significa que toda vez que rodar o projeto, o Spring vai olhar a classe e atualizar as tabelas do banco automaticamente (criar colunas novas, etc).
spring.jpa.hibernate.ddl-auto=update

# 4. Mostra no terminal os comandos SQL que o Spring está gerando por trás dos panos
spring.jpa.show-sql=true